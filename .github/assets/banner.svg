<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <pattern id="lines" width="1200" height="34" patternUnits="userSpaceOnUse"><line x1="0" y1="33" x2="1200" y2="33" stroke="#bfdbfe"/></pattern>
    <style>.tick{stroke-dasharray:40;stroke-dashoffset:40;animation:t 4s ease -1.5s infinite}.t2{animation-delay:-.9s}@keyframes t{20%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:40}}</style>
  </defs>
  <rect width="1200" height="320" fill="#fffdf5"/>
  <rect width="1200" height="320" fill="url(#lines)"/>
  <line x1="110" y1="0" x2="110" y2="320" stroke="#fca5a5" stroke-width="2"/>
  <g fill="#e7e5e4"><circle cx="50" cy="60" r="12"/><circle cx="50" cy="160" r="12"/><circle cx="50" cy="260" r="12"/></g>
  <text x="140" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700" fill="#1c1917">Task Desk</text>
  <text x="144" y="172" font-family="Consolas, Menlo, monospace" font-size="19" fill="#57534e">add · search · filter · complete · delete</text>
  <g transform="translate(144 204)" font-family="Consolas, Menlo, monospace" font-size="15">
    <rect width="66" height="28" rx="4" fill="#dcfce7"/><text x="33" y="19" text-anchor="middle" fill="#166534" font-weight="700">GET</text>
    <rect x="74" width="74" height="28" rx="4" fill="#dbeafe"/><text x="111" y="19" text-anchor="middle" fill="#1e40af" font-weight="700">POST</text>
    <rect x="156" width="80" height="28" rx="4" fill="#fef3c7"/><text x="196" y="19" text-anchor="middle" fill="#92400e" font-weight="700">PATCH</text>
    <rect x="244" width="90" height="28" rx="4" fill="#fee2e2"/><text x="289" y="19" text-anchor="middle" fill="#991b1b" font-weight="700">DELETE</text>
    <text x="350" y="19" fill="#78716c">/api/tasks</text>
  </g>
  <!-- sticky checklist -->
  <g transform="translate(830 36) rotate(3)">
    <rect x="6" y="8" width="300" height="236" fill="#000" opacity=".08"/>
    <rect width="300" height="236" fill="#fde68a"/>
    <rect x="110" y="-12" width="80" height="26" fill="#fff" opacity=".6" transform="rotate(-4 150 0)"/>
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#44403c">
      <rect x="28" y="40" width="24" height="24" rx="4" fill="none" stroke="#44403c" stroke-width="2.5"/><path class="tick" d="M32 52l7 7 13-15" fill="none" stroke="#16a34a" stroke-width="4"/>
      <text x="66" y="60" text-decoration="line-through" fill="#a8a29e">ship health check</text>
      <rect x="28" y="96" width="24" height="24" rx="4" fill="none" stroke="#44403c" stroke-width="2.5"/><path class="tick t2" d="M32 108l7 7 13-15" fill="none" stroke="#16a34a" stroke-width="4"/>
      <text x="66" y="116" text-decoration="line-through" fill="#a8a29e">deploy to Vercel</text>
      <rect x="28" y="152" width="24" height="24" rx="4" fill="none" stroke="#44403c" stroke-width="2.5"/>
      <text x="66" y="172">write the next task</text>
      <text x="28" y="218" font-family="Consolas, Menlo, monospace" font-size="13" fill="#92400e">{"status":"ok"}</text>
    </g>
  </g>
</svg>
